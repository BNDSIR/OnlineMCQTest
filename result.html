<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Results Portal</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --primary: #1d3557;
            --secondary: #457b9d;
            --text-main: #333333;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); padding: 20px; color: var(--text-main); }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 900px; margin: 0 auto 20px auto; }
        
        select, button { padding: 12px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; width: 100%; font-size: 16px; }
        button { background: var(--primary); color: white; cursor: pointer; border: none; font-weight: bold; }
        button:hover { background: var(--secondary); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: var(--primary); color: white; }
        
        /* Modal for viewing the answer script */
        #script-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); overflow-y: auto; padding-top: 20px; z-index: 1000;
        }
        .modal-content {
            background: white; max-width: 800px; margin: auto; padding: 30px; border-radius: 8px; margin-bottom: 40px;
        }
        .modal-actions { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-print { background-color: #fca311; color: black; } 
        .btn-close { background-color: #e63946; }

        .pdf-header { text-align: center; border-bottom: 2px solid #ccc; padding-bottom: 10px; margin-bottom: 20px; }
        .q-block { margin-bottom: 15px; padding: 10px; border: 1px solid #eee; border-radius: 5px; }
        .correct { color: green; font-weight: bold; }
        .incorrect { color: red; font-weight: bold; }
        
        .student-action-box { background: #e9f5ed; padding: 20px; border-radius: 8px; border: 1px solid #b7e4c7; margin-top: 20px; }

        /* --- NATIVE PRINT SETTINGS (Hides everything except the answer script) --- */
        @media print {
            body { margin: 0; padding: 0; background: white; }
            body * { visibility: hidden; } 
            
            #script-modal {
                position: absolute; left: 0; top: 0; 
                width: 100%; height: auto;
                background: white !important; overflow: visible;
                padding: 0;
            }
            .modal-content { box-shadow: none; padding: 0; margin: 0; width: 100%; }
            
            #pdf-content, #pdf-content * { visibility: visible; }
            #pdf-content { position: absolute; left: 0; top: 0; width: 100%; }
            
            .modal-actions { display: none !important; } /* Hides buttons on printed paper */
        }
    </style>
</head>
<body>

    <div class="card" id="selection-section">
        <h2 style="text-align: center; color: var(--primary);">Biology Mock Test Results</h2>
        <p id="loading-msg" style="text-align: center; color: red;">Fetching records... Please wait.</p>
        
        <div id="main-content" style="display:none;">
            <label><strong>1. Select Exam Date:</strong></label>
            <select id="exam-date" onchange="loadDateData()">
                <option value="">-- Choose Date --</option>
            </select>

            <div id="date-section" style="display:none;">
                
                <!-- Student Specific Download Area -->
                <div class="student-action-box">
                    <h3 style="margin-top: 0; color: #1b4332;">Download Your Answer Script</h3>
                    <label><strong>2. Select Your Name:</strong></label>
                    <select id="student-name-select">
                        <option value="">-- Choose your name --</option>
                    </select>
                    <button onclick="viewMyScript()" style="background-color: #2d6a4f; margin-top: 10px;">View & Download My Script</button>
                </div>

                <!-- Master Merit List -->
                <h3 style="margin-top: 30px; border-bottom: 2px solid #ccc; padding-bottom: 5px;">Master Merit List</h3>
                <div style="overflow-x: auto;">
                    <table id="results-table">
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Name</th>
                                <th>Roll No</th>
                                <th>Class</th>
                                <th>Score</th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <!-- The Answer Script Modal -->
    <div id="script-modal">
        <div class="modal-content">
            <div class="modal-actions">
                <button class="btn-close" onclick="closeModal()">Close</button>
                <!-- Native Print Button -->
                <button class="btn-print" onclick="window.print()">🖨️ Print / Save as PDF</button>
            </div>
            
            <div id="pdf-content">
                <div class="pdf-header">
                  <h2 id="pdf-date-header"></h2>
                    <h3>Biology - Exam Answer Script</h3>
                    <p id="student-details-header"></p>
                </div>
                <div id="script-body"></div>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxNvXHADMVIGy7DR9qTx1PjGIwkvgVDEgQDop6mXl3FGWUUh3OgsppKpod_4CoBclUK6w/exec";
        
        let allResults = [];
        let questionsData = [];
        let currentFilteredResults = [];
        let currentStudent = null;

        // 1. Fetch data automatically on load (No password needed)
        window.onload = function() {
            fetch(`${WEB_APP_URL}?action=getPublicResults`)
                .then(res => res.json())
                .then(resultRes => {
                    allResults = resultRes.data;
                    questionsData = resultRes.questions;
                    populateDateDropdown();
                    document.getElementById('loading-msg').style.display = 'none';
                    document.getElementById('main-content').style.display = 'block';
                }).catch(err => {
                    document.getElementById('loading-msg').innerText = "Error loading data. Check connection.";
                });
        }

        // 2. Find unique dates and populate the first dropdown
        function populateDateDropdown() {
            const dateSelect = document.getElementById('exam-date');
            // Get unique dates
            const uniqueDates = [...new Set(allResults.map(r => new Date(r.Timestamp).toLocaleDateString()))];
            
            uniqueDates.forEach(date => {
                const opt = document.createElement('option');
                opt.value = date;
                opt.innerText = date;
                dateSelect.appendChild(opt);
            });
        }

        // 3. When a date is selected, build the Merit List and the Name dropdown
        function loadDateData() {
            const selectedDate = document.getElementById('exam-date').value;
            if (!selectedDate) {
                document.getElementById('date-section').style.display = 'none';
                return;
            }

            // Filter results by selected date
            currentFilteredResults = allResults.filter(r => new Date(r.Timestamp).toLocaleDateString() === selectedDate);
            
            // Sort to create a Merit List (Highest score first)
            currentFilteredResults.sort((a, b) => b.Score - a.Score);

            const tbody = document.getElementById('table-body');
            const nameSelect = document.getElementById('student-name-select');
            
            tbody.innerHTML = "";
            nameSelect.innerHTML = '<option value="">-- Choose your name --</option>';

            currentFilteredResults.forEach((student, index) => {
                // Populate Merit Table
                tbody.innerHTML += `
                    <tr style="${index === 0 ? 'background-color: #f1faee; font-weight: bold;' : ''}">
                        <td>#${index + 1}</td>
                        <td>${student.Name}</td>
                        <td>${student.Roll_No}</td>
                        <td>${student.Class}</td>
                        <td style="color: green; font-weight: bold;">${student.Score}</td>
                    </tr>
                `;

                // Populate Name Dropdown (Saving the array index as the value)
                const opt = document.createElement('option');
                opt.value = index;
                opt.innerText = `${student.Name} (Roll: ${student.Roll_No})`;
                nameSelect.appendChild(opt);
            });

            document.getElementById('date-section').style.display = 'block';
        }

        // 4. Build the Answer Script for the selected student
       // 4. Build the Answer Script for the selected student
        function viewMyScript() {
            const selectedIndex = document.getElementById('student-name-select').value;
            if (selectedIndex === "") {
                alert("Please select your name from the dropdown first.");
                return;
            }

            currentStudent = currentFilteredResults[selectedIndex];
            const answers = JSON.parse(currentStudent.Answer_Script); 
            
            // Grab the date the student selected from the dropdown
            const selectedDate = document.getElementById('exam-date').value;
            
            // Set the Date at the very top of the PDF
            document.getElementById('pdf-date-header').innerText = `Exam Date: ${selectedDate}`;
            
            document.getElementById('student-details-header').innerHTML = `
                <strong>Name:</strong> ${currentStudent.Name} &nbsp;|&nbsp; 
                <strong>Roll No:</strong> ${currentStudent.Roll_No} &nbsp;|&nbsp; 
                <strong>Score:</strong> ${currentStudent.Score}
            `;

            let scriptHTML = "";
            questionsData.forEach((q, i) => {
                const studentAnsKey = answers[q.Q_ID]; 
                const isAttempted = !!studentAnsKey; 
                const isCorrect = (studentAnsKey === q.CorrectAnswer);
                
                const statusClass = isCorrect ? "correct" : "incorrect";
                const statusIcon = isCorrect ? "✓" : (isAttempted ? "✗" : "-");

                const studentAnsText = isAttempted ? q[studentAnsKey] : "Not Attempted";
                const correctAnsText = q[q.CorrectAnswer];

                scriptHTML += `
                    <div class="q-block">
                        <p style="margin-bottom: 8px;"><strong>Q${i+1}.</strong> ${q.Question}</p>
                        
                        <div style="margin-left: 15px; font-size: 0.95em; color: #555; margin-bottom: 12px; line-height: 1.4;">
                            <div><strong>A)</strong> ${q.OptionA}</div>
                            <div><strong>B)</strong> ${q.OptionB}</div>
                            <div><strong>C)</strong> ${q.OptionC}</div>
                            <div><strong>D)</strong> ${q.OptionD}</div>
                        </div>
                        
                        <p style="margin-top: 0; margin-bottom: 4px;">Your Answer: <span class="${statusClass}">${studentAnsText} ${statusIcon}</span></p>
                        ${!isCorrect ? `<p style="color:gray; font-size: 0.9em; margin-top: 0;">Correct Answer was: ${correctAnsText}</p>` : ''}
                    </div>
                `;
            });

            document.getElementById('script-body').innerHTML = scriptHTML;
            document.getElementById('script-modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('script-modal').style.display = 'none';
        }
    </script>
</body>
</html>
